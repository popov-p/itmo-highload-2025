name: highload-2025-ci

on:
  push:
    branches:
      - "467160"
  pull_request:
    branches:
      - "467160"

jobs:
#  build:
#    runs-on: ubuntu-22.04
#    steps:
#      - name: Checkout code
#        uses: actions/checkout@v3
#
#      - name: Build Docker images
#        run: docker compose build

  test:
    runs-on: ubuntu-22.04
#    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Upgrade pip and install Poetry via pip
        run: |
          python -m pip install --upgrade pip
          pip install poetry

      - name: Install dependencies
        run: |
          cd controller && poetry install
          cd ../rule_engine && poetry install

      - name: Run Unit tests
        env:
          PROTOCOL_BUFFERS_PYTHON_IMPLEMENTATION: python
        run: |
          cd controller && poetry run pytest -m unit
          cd ../rule_engine && poetry run pytest -m unit

      - name: Integration tests
        env:
          PROTOCOL_BUFFERS_PYTHON_IMPLEMENTATION: python
        run: |
          docker compose up -d tsung
          docker compose up -d nginx
          docker compose up -d controller
          docker compose up -d rule_engine
          docker compose logs -f &

          cd controller && poetry run pytest -m integration
          cd ../rule_engine && poetry run pytest -m integration

      #--------------------------------------------------------

      - name: Load tests -- Many clients, Few requests
        run: |
          docker exec itmo-highload-2025-tsung-1 tsung -f ./scenarios/many-clients-few-requests.xml start

      - name: Get Tsung log directory -- Many clients, Few requests
        run: |
          TSUNG_LOG_DIR=$(docker exec itmo-highload-2025-tsung-1 sh -c 'ls -td /root/.tsung/log/* | head -n 1')
          echo "Found Tsung log dir: $TSUNG_LOG_DIR"
          echo "TSUNG_LOG_DIR=$TSUNG_LOG_DIR" >> $GITHUB_ENV

      - name: Copy logs from container to host -- Many requests, Few clients
        run: |
          mkdir -p tsung-reports
          docker cp itmo-highload-2025-tsung-1:$TSUNG_LOG_DIR ./tsung-reports/tsung-many-clients-few-requests-logs

      #--------------------------------------------------------

      - name: Load tests -- Many requests, Few clients
        run: |
          docker exec itmo-highload-2025-tsung-1 tsung -f ./scenarios/many-requests-few-clients.xml start

      - name: Get Tsung log directory -- Many requests, Few clients
        run: |
          TSUNG_LOG_DIR=$(docker exec itmo-highload-2025-tsung-1 sh -c 'ls -td /root/.tsung/log/* | head -n 1')
          echo "Found Tsung log dir: $TSUNG_LOG_DIR"
          echo "TSUNG_LOG_DIR=$TSUNG_LOG_DIR" >> $GITHUB_ENV

      - name: Copy logs from container to host -- Many requests, Few clients
        run: |
          docker cp itmo-highload-2025-tsung-1:$TSUNG_LOG_DIR ./tsung-reports/tsung-many-requests-few-clients-logs

      #--------------------------------------------------------

      - name: Load tests -- Many clients, Many requests
        run: |
          docker exec itmo-highload-2025-tsung-1 tsung -f ./scenarios/many-clients-many-requests.xml start

      - name: Get Tsung log directory -- Many requests, Few clients
        run: |
          TSUNG_LOG_DIR=$(docker exec itmo-highload-2025-tsung-1 sh -c 'ls -td /root/.tsung/log/* | head -n 1')
          echo "Found Tsung log dir: $TSUNG_LOG_DIR"
          echo "TSUNG_LOG_DIR=$TSUNG_LOG_DIR" >> $GITHUB_ENV

      - name: Copy logs from container to host -- Many requests, Few clients
        run: |
          docker cp itmo-highload-2025-tsung-1:$TSUNG_LOG_DIR ./tsung-reports/tsung-many-clients-many-requests-logs

      #--------------------------------------------------------

      - name: Upload Tsung logs as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: tsung-reports
          path: tsung-reports


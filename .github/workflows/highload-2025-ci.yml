name: highload-2025-ci

on:
  push:
    branches:
      - "467160"
  pull_request:
    branches:
      - "467160"

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Upgrade pip and install Poetry via pip
        run: |
          python -m pip install --upgrade pip
          pip install poetry

      - name: Install controller dependencies
        run: |
          cd controller
          poetry install

      - name: Run Controller tests
        run: |
          cd controller
          poetry run pytest
  filebeat:
    image: elastic/filebeat:8.15.3
    volumes:
      - ./filebeat.yml:/usr/share/filebeat/filebeat.yml
      - logs_storage:/var/log
    networks:
      - backend
    restart: on-failure

  redis:
    image: redis:latest
    ports:
      - "6379:6379"
    networks:
      - backend
    restart: on-failure

  nginx:
    image: nginx:latest
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./index.html:/usr/share/nginx/html/index.html
    restart: on-failure
    networks:
      - backend

volumes:
  config_data:
  rabbitmq_data:
  controller_src:
  datasim_src:
  tsung_src:
  rule_engine_src:
  grafana_storage:
  prometheus_data:
  logs_storage:

networks:
  backend:
    driver: bridge

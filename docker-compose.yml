#    command: >
#      mongos --configdb cfg/configsvr:27017 --keyFile /etc/mongo-keyfile --bind_ip_all
#    volumes:
#      - ./mongo-keyfile:/etc/mongo-keyfile:ro
#    networks:
#      - backend

  init-mongo:
    image: mongo:6
    volumes:
      - ./init-replica.sh:/init-replica.sh
    networks:
      - backend
    depends_on:
      - mongo
      - mongo_replica
      - mongo_arbiter
    entrypoint:
      - bash
      - -c
      - |
        sleep 7
        mongosh --host mongo:27017 -u pavel -p popov --authenticationDatabase admin <<EOF
        rs.initiate({
          _id: "rs0",
          members: [
            { _id: 0, host: "mongo:27017" },
            { _id: 1, host: "mongo_replica:27017" },
            { _id: 2, host: "mongo_arbiter:27017", arbiterOnly: true }
          ]
        })
        EOF

    deploy:
      restart_policy:
        condition: none

  controller:
    build:
      context: ./controller
    restart: on-failure
    volumes:
      - controller_src:/controller/src
      - logs_storage:/var/log/
    develop:
      watch:
        - action: sync+restart
          path: .
          target: .
    depends_on:
      - mongo
      - mongo_replica
      - redis
      - rabbitmq
    networks:
      - backend

  rule_engine:
    build:
      context: ./rule_engine
    restart: on-failure
    volumes:
      - rule_engine_src:/rule_engine/src
      - logs_storage:/var/log/
    ports:
      - "8700:8700"
    develop:
      watch:
        - action: sync+restart
          path: .
          target: .
    depends_on:
      - controller
      - mongo
      - mongo_replica
      - redis
      - rabbitmq
    networks:
      - backend

  datasim:
    build:
      context: ./datasim
    restart: always
    volumes:
      - datasim_src:/datasim/src
      - logs_storage:/var/log/
    ports:
      - "8070:8070"
    develop:
      watch:
        - action: sync+restart
          path: .
          target: .
    depends_on:
      - rule_engine
    networks:
      - backend

  grafana:
    image: grafana/grafana:latest
    depends_on:
      - prometheus
    restart: unless-stopped
    ports:
      - '3000:3000'
    volumes:
      - grafana_storage:/var/lib/grafana
    networks:
      - backend

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - prometheus_data:/prometheus
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    networks:
      - backend


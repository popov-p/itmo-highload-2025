services:
  rabbitmq:
    image: rabbitmq:3-management
    restart: on-failure
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: pavel
      RABBITMQ_DEFAULT_PASS: popov
    networks:
      - backend

  mongo:
    image: mongo:6
    ports:
      - '27017:27017'
    command: [ "--replSet", "rs0",
               "--auth",
               "--keyFile", "/etc/mongo-keyfile", "--bind_ip_all" ]
    environment:
      MONGO_INITDB_ROOT_USERNAME: pavel
      MONGO_INITDB_ROOT_PASSWORD: popov
    volumes:
      - ./mongo-keyfile:/etc/mongo-keyfile:ro
      - mongo_data:/data/db
    networks:
      - backend

  mongo_replica:
    image: mongo:6
    ports:
      - '27018:27017'
    command: [ "--replSet", "rs0",
               "--auth",
               "--keyFile", "/etc/mongo-keyfile",
               "--bind_ip_all" ]
    environment:
      MONGO_INITDB_ROOT_USERNAME: pavel
      MONGO_INITDB_ROOT_PASSWORD: popov

    volumes:
      - ./mongo-keyfile:/etc/mongo-keyfile:ro
      - mongo_replica:/data/db
    networks:
      - backend

  mongo_arbiter:
    image: mongo:6
    command: [ "--replSet", "rs0", "--auth",
              "--keyFile", "/etc/mongo-keyfile",
               "--bind_ip_all" ]
    environment:
      MONGO_INITDB_ROOT_USERNAME: pavel
      MONGO_INITDB_ROOT_PASSWORD: popov
    ports:
      - '27019:27017'
    volumes:
      - ./mongo-keyfile:/etc/mongo-keyfile:ro
    networks:
      - backend

#  configsvr:

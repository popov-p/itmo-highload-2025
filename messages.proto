syntax = "proto3";

package dm;

message Batch {
    float ker_temp = 1;
    float ker_load = 2;
    float mem_temp = 3;
    float mem_load = 4;
    string timestamp = 5;
    GpuInfo gpu_info = 6;
}

message GpuInfo {
    int32 gpu_id = 1;
    string model = 2;
    float max_ker_temp = 3;
    float max_mem_temp = 4;
}